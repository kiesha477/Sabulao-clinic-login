<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sabulao Clinic - Login System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- SINGLE MAIN CONTAINER CARD -->
  <div id="authContainer" class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 border border-gray-100">
    
    <!-- Dynamic Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm border text-center"></div>

    <!-- 1. SIGN IN FORM -->
    <form id="loginForm" class="space-y-4">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Sign In</h2>
      
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Username</label>
        <input type="text" id="loginUser" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="Enter username" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Password</label>
        <input type="password" id="loginPass" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="Enter password" />
      </div>

      <button type="submit" 
        class="w-full bg-[#0f4c4a] hover:bg-[#0b3c3d] text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
        Sign In
      </button>

      <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account yet? 
        <button type="button" id="toRegisterBtn" class="text-[#0f4c4a] font-semibold hover:underline bg-transparent border-0 cursor-pointer">Register here!</button>
      </p>
    </form>

    <!-- 2. CREATE CLIENT ACCOUNT FORM -->
    <form id="registerForm" class="hidden space-y-4">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Create Client Account</h2>

      <!-- Full Name -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Full Name</label>
        <input type="text" id="regFullName" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="Full name" />
      </div>

      <!-- Gmail / Email -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Gmail / Email</label>
        <input type="email" id="regEmail" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="name@gmailcom" />
      </div>

      <!-- Mobile Number -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Mobile Number</label>
        <input type="tel" id="regMobile" required placeholder="09123456789" pattern="[0-9]{11}" maxlength="11"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" />
      </div>

      <!-- Choose Username -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Choose Username</label>
        <input type="text" id="regUser" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="Your new username" />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Password</label>
        <input type="password" id="regPass" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="Create password" />
        
        <div class="mt-2 bg-teal-50 border border-teal-100 rounded-lg p-2.5 text-xs text-[#0f4c4a] leading-relaxed">
          <span class="font-semibold">Requirement:</span>at least 1 capital letter (A-Z) and 1 special symbol (!@#$%^&*).
        </div>
      </div>

      <!-- Verify Password -->
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-600 tracking-wider mb-1">Verify Password</label>
        <input type="password" id="regConfirmPass" required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0f4c4a] focus:border-[#0f4c4a] outline-none transition text-sm text-gray-800" placeholder="Re-enter password" />
      </div>

      <!-- Terms & Privacy Checkbox -->
      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="regTermsCheck" class="w-4 h-4 text-[#0f4c4a] rounded border-gray-300 focus:ring-[#0f4c4a] cursor-pointer" />
        <label for="regTermsCheck" class="text-xs text-gray-600 cursor-pointer select-none">
          I agree to the <a href="#" class="text-[#0f4c4a] font-semibold hover:underline">Terms</a> & <a href="#" class="text-[#0f4c4a] font-semibold hover:underline">Privacy Policy</a>
        </label>
      </div>

      <!-- Register Button -->
      <button type="submit" 
        class="w-full bg-[#0f4c4a] hover:bg-[#0b3c3d] text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
        Register
      </button>

      <!-- Switch to Login -->
      <p class="text-center text-sm text-gray-600 mt-4">
        do have an account?
        <button type="button" id="toLoginBtn" class="text-[#0f4c4a] font-semibold hover:underline bg-transparent border-0 cursor-pointer">Sign in here</button>
      </p>
    </form>

  </div>

  <script src="login.js"></script>
</body>
</html>
