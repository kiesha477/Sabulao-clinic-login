<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="login.css" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 border border-gray-100 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Client Dashboard</h1>
    <p class="text-gray-600 mb-6">Welcome, <span id="clientWelcomeName" class="font-bold text-blue-600"></span>!</p>
    
    <button id="clientLogoutBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2.5 rounded-lg transition">
      Logout
    </button>
  </div>

  <script src="client.js"></script>

</html>
